<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 280px;
      background: #0a0a0a;
      color: #e5e7eb;
      font-family: 'JetBrains Mono', 'Consolas', 'SF Mono', monospace;
      font-size: 12px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      border-bottom: 1px solid #1e1e1e;
    }
    .header img { width: 24px; height: 24px; }
    .header h1 { font-size: 13px; font-weight: 700; letter-spacing: 1px; }
    .status {
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dot {
      width: 8px; height: 8px;
      background: #ef4444;
      animation: pulse 2s infinite;
    }
    .dot.connected { background: #22c55e; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .toggle-row {
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid #1e1e1e;
    }
    .toggle {
      width: 36px; height: 18px;
      background: #333;
      cursor: pointer;
      position: relative;
      transition: background 0.2s;
    }
    .toggle.on { background: #E64A00; }
    .toggle::after {
      content: '';
      position: absolute;
      top: 2px; left: 2px;
      width: 14px; height: 14px;
      background: #fff;
      transition: left 0.2s;
    }
    .toggle.on::after { left: 20px; }
    .info {
      padding: 8px 12px;
      border-top: 1px solid #1e1e1e;
      color: #6b7280;
      font-size: 10px;
    }
    .port { color: #E64A00; }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="">
    <h1>FLOW</h1>
  </div>
  <div class="status">
    <div class="dot" id="statusDot"></div>
    <span id="statusText">Checking...</span>
  </div>
  <div class="toggle-row">
    <span>Intercept Downloads</span>
    <div class="toggle on" id="toggle"></div>
  </div>
  <div class="info">
    Port: <span class="port" id="portDisplay">15151</span>
  </div>
  <script src="popup.js"></script>
</body>
</html>
