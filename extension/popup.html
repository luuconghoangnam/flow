<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 280px;
      background: #0a0a0a;
      color: #e5e7eb;
      font-family: 'JetBrains Mono', 'Consolas', monospace;
      font-size: 12px;
      overflow: hidden;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      border-bottom: 1px solid #1e1e1e;
    }
    .header img { width: 20px; height: 20px; }
    .header span { font-weight: 700; letter-spacing: 1px; font-size: 13px; }
    .status {
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 0;
      background: #ef4444;
    }
    .dot.connected { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
    .status-text { color: #6b7280; }
    .status-text.connected { color: #22c55e; }
    .toggle-row {
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid #1e1e1e;
    }
    .toggle-label { color: #9ca3af; font-size: 11px; }
    .toggle {
      position: relative;
      width: 36px; height: 18px;
      background: #333;
      cursor: pointer;
      transition: background 0.2s;
    }
    .toggle.on { background: #E64A00; }
    .toggle::after {
      content: '';
      position: absolute;
      top: 2px; left: 2px;
      width: 14px; height: 14px;
      background: #fff;
      transition: left 0.2s;
    }
    .toggle.on::after { left: 20px; }
    .info {
      padding: 10px 14px;
      border-top: 1px solid #1e1e1e;
      color: #4b5563;
      font-size: 10px;
      line-height: 1.4;
    }
    .port { color: #E64A00; }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="">
    <span>FLOW</span>
  </div>
  <div class="status">
    <div class="dot" id="dot"></div>
    <span class="status-text" id="statusText">Checking...</span>
  </div>
  <div class="toggle-row">
    <span class="toggle-label">Auto-intercept downloads</span>
    <div class="toggle on" id="toggle"></div>
  </div>
  <div class="info">
    Port: <span class="port" id="portDisplay">15151</span> · 
    Ensure Flow app is running
  </div>
  <script src="popup.js"></script>
</body>
</html>
