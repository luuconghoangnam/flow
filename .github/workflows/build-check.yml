name: Build Check

# Runs on every PR and push to main/dev to catch compile errors early.
# Does not produce release artifacts — use publish.yml for that.
on:
  pull_request:
    branches: [ main, dev ]
  push:
    branches: [ main, dev ]

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile (Desktop + Android)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up JBR 21
        uses: actions/setup-java@v4
        with:
          distribution: "jetbrains"
          java-package: "jdk"
          java-version: "21"
          check-latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ubuntu-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ubuntu-gradle-

      # Compile all KMP common + desktop sources
      - name: Compile desktop sources
        run: ./gradlew compileKotlinDesktop --no-daemon --continue

      # Compile Android sources (requires Android SDK — actions/setup-java + AGP handles this)
      - name: Compile Android sources
        run: ./gradlew compileDebugKotlin --no-daemon --continue

      # Run unit tests on JVM (desktopTest targets commonTest too)
      - name: Run unit tests
        run: ./gradlew :downloader:core:desktopTest --no-daemon --continue

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/build/reports/tests/"
          if-no-files-found: ignore

      - name: Stop Gradle daemon
        if: always()
        run: ./gradlew --stop

  android-lint:
    name: Android Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up JBR 21
        uses: actions/setup-java@v4
        with:
          distribution: "jetbrains"
          java-package: "jdk"
          java-version: "21"
          check-latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ubuntu-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ubuntu-gradle-

      - name: Run Android lint
        run: ./gradlew :android:app:lintDebug --no-daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Stop Gradle daemon
        if: always()
        run: ./gradlew --stop
