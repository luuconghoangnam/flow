name: Build & Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub Release draft"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            build_android: true
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            build_android: false
          - os: windows-2022
            platform: windows-x64
            build_android: false
          - os: windows-11-arm
            platform: windows-arm64
            build_android: false
          - os: macos-15-intel
            platform: macos-intel
            build_android: false
          - os: macos-15
            platform: macos-arm64
            build_android: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make gradlew executable
        if: runner.os != 'Windows'
        run: chmod +x ./gradlew

      - name: Set up JBR 21
        uses: actions/setup-java@v4
        with:
          distribution: "jetbrains"
          java-package: "jdk"
          java-version: "21"
          check-latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ matrix.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ matrix.os }}-gradle-
          enableCrossOsArchive: true

      - name: Skip Android build
        if: ${{ !matrix.build_android }}
        shell: bash
        run: echo "SKIP_ANDROID_BUILD=true" >> $GITHUB_ENV

      - name: Install create-dmg (macOS only)
        if: startsWith(matrix.os, 'macos-')
        run: brew install create-dmg

      - name: Build packages
        shell: bash
        run: ./gradlew createReleaseFolderForCi

      - name: Build debug APK
        if: ${{ matrix.build_android }}
        shell: bash
        run: |
          ./gradlew android:app:assembleDebug
          APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" "build/ci-release/binaries/Flow-android-debug.apk"
          fi

      - name: Stop Gradle daemon
        shell: bash
        run: ./gradlew --stop

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          path: ./build/ci-release
          name: build-${{ matrix.platform }}
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [ "build" ]
    if: ${{ always() && (startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true) }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: "build-*"
          merge-multiple: true

      - name: Show release tree
        run: find release -type f || true

      - name: Determine version tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v0.0.0-dev"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_stable=true" >> $GITHUB_OUTPUT
          else
            echo "is_stable=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          prerelease: ${{ steps.version.outputs.is_stable != 'true' }}
          make_latest: legacy
          draft: true
          files: |
            release/binaries/*
          generate_release_notes: true

      - name: Cleanup artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          name: build-*
