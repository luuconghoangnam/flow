name: Build & Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub Release draft"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  create-packages:
    strategy:
      fail-fast: false
      matrix:
        os: [ "ubuntu-latest", "ubuntu-24.04-arm", "windows-2022", "windows-11-arm", "macos-15-intel", "macos-15" ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make gradlew executable
        if: runner.os != 'Windows'
        run: chmod +x ./gradlew

      - name: Set up JBR
        uses: actions/setup-java@v4
        with:
          distribution: "jetbrains"
          java-package: "jdk"
          java-version: "21"
          check-latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ matrix.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ matrix.os }}-gradle-
          enableCrossOsArchive: true

      - name: Skip Android build (build android only on Ubuntu)
        if: matrix.os != 'ubuntu-latest'
        shell: bash
        run: echo "SKIP_ANDROID_BUILD=true" >> $GITHUB_ENV

      - name: Use Android Secrets
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "FLOW_KEYSTORE_FILE=${{ secrets.FLOW_KEYSTORE_FILE }}" >> $GITHUB_ENV
          echo "FLOW_KEYSTORE_FILE_PASSWORD=${{ secrets.FLOW_KEYSTORE_FILE_PASSWORD }}" >> $GITHUB_ENV
          echo "FLOW_KEYSTORE_KEY_ALIAS=${{ secrets.FLOW_KEYSTORE_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "FLOW_KEYSTORE_KEY_PASSWORD=${{ secrets.FLOW_KEYSTORE_KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Install create-dmg (macOS only)
        if: startsWith(matrix.os, 'macos-')
        run: brew install create-dmg

      - name: Gradle wrapper validation
        run: ./gradlew --version
        shell: bash

      - name: Build package for current OS
        shell: bash
        run: ./gradlew createReleaseFolderForCi

      - name: Stop Gradle daemon
        shell: bash
        run: ./gradlew --stop

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          path: ./build/ci-release
          name: app-${{ matrix.os }}
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [ "create-packages" ]
    if: ${{ always() && (startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true) }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: app-*
          merge-multiple: true

      - name: Show release tree
        run: tree . || find . -type f

      - name: Determine version tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v0.0.0-dev"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_stable=true" >> $GITHUB_OUTPUT
          else
            echo "is_stable=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          prerelease: ${{ steps.version.outputs.is_stable != 'true' }}
          make_latest: legacy
          draft: true
          files: |
            release/binaries/*
          body_path: release/release-notes.md
          generate_release_notes: true

      - name: Cleanup artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          name: app-*
