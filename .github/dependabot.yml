version: 2
updates:
  # Gradle dependencies (libs.versions.toml)
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      # Group Compose updates together to reduce PR noise
      compose:
        patterns:
          - "org.jetbrains.compose*"
          - "androidx.compose*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
      koin:
        patterns:
          - "io.insert-koin*"

  # GitHub Actions versions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
