<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Download</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dialog">
    <div class="dialog-header">
      <span class="icon">📥</span>
      <h3>Add Download</h3>
    </div>

    <div class="field">
      <label>URL</label>
      <input id="url" class="url-display" readonly value="" title="">
    </div>

    <div class="file-info" id="fileInfo" style="display:none;">
      <span id="fileSize"></span>
      <span id="fileType"></span>
    </div>

    <div class="field">
      <label>Filename</label>
      <input id="name" value="" spellcheck="false">
    </div>

    <div class="field">
      <label>Save to</label>
      <div class="field-row">
        <input id="folder" value="" readonly>
        <button class="btn-browse" onclick="doBrowse()" title="Choose folder">📁</button>
      </div>
    </div>

    <div class="field-row category-queue-row">
      <div class="field half-width">
        <label class="check-label">
          <input type="checkbox" id="useCategory" onchange="toggleCategory()"> Use Category
        </label>
        <select id="category" disabled onchange="onCategoryChange()">
          <option value="0">Loading...</option>
        </select>
      </div>
      <div class="field half-width">
        <label>Queue</label>
        <select id="queue" onchange="onQueueChange()">
          <option value="0">None (Download immediately)</option>
        </select>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-secondary" onclick="doCancel()">Cancel</button>
      <button class="btn btn-primary" id="btnDownload" onclick="doDownload()">Download</button>
    </div>
  </div>

  <script>
    let categories = [];

    function doDownload() {
      const url = document.getElementById('url').value;
      const name = document.getElementById('name').value;
      const folder = document.getElementById('folder').value;

      const useCat = document.getElementById('useCategory').checked;
      const catSelect = document.getElementById('category');
      let categoryId = 0;
      if (useCat && catSelect.value) {
        categoryId = parseInt(catSelect.value, 10);
      }

      const qSelect = document.getElementById('queue');
      let queueId = 0;
      if (qSelect.value) {
        queueId = parseInt(qSelect.value, 10);
      }

      const startNow = (queueId === 0);

      if (!url || !name) return;
      document.getElementById('btnDownload').disabled = true;
      document.getElementById('btnDownload').textContent = 'Processing...';
      
      if (window.flowDownload) {
        window.flowDownload(url, name, folder, categoryId, queueId, startNow);
      }
    }

    function doBrowse() {
      if (window.flowBrowse) {
        window.flowBrowse().then(function(path) {
          if (path && path.length > 0) {
            document.getElementById('folder').value = path;
          }
        });
      }
    }

    function doCancel() {
      if (window.flowCancel) window.flowCancel();
    }

    function loadCategoriesAndQueues() {
      if (window.flowGetCategories) {
        window.flowGetCategories().then(cats => {
          categories = cats || [];
          const catSelect = document.getElementById('category');
          catSelect.innerHTML = '';
          if (categories.length === 0) {
             const opt = document.createElement('option');
             opt.value = "0";
             opt.textContent = "No categories";
             catSelect.appendChild(opt);
          } else {
             categories.forEach(c => {
               const opt = document.createElement('option');
               opt.value = c.id;
               opt.textContent = c.name;
               catSelect.appendChild(opt);
             });
          }
        }).catch(e => console.error("categories error", e));
      }

      if (window.flowGetQueues) {
        window.flowGetQueues().then(queues => {
          const qSelect = document.getElementById('queue');
          qSelect.innerHTML = '<option value="0">None (Download immediately)</option>';
          if (queues) {
             queues.forEach(q => {
               const opt = document.createElement('option');
               opt.value = q.id;
               opt.textContent = q.name;
               qSelect.appendChild(opt);
             });
          }
        }).catch(e => console.error("queues error", e));
      }
    }

    function toggleCategory() {
      const checked = document.getElementById('useCategory').checked;
      document.getElementById('category').disabled = !checked;
      if (checked) onCategoryChange();
    }

    function onCategoryChange() {
      const catSelect = document.getElementById('category');
      const id = parseInt(catSelect.value, 10);
      const cat = categories.find(c => c.id === id);
      if (cat && cat.usePath && cat.path) {
         document.getElementById('folder').value = cat.path;
      }
    }

    function onQueueChange() {
      const qSelect = document.getElementById('queue');
      const btn = document.getElementById('btnDownload');
      if (qSelect.value === "0") {
         btn.textContent = "Download";
      } else {
         btn.textContent = "Add to Queue";
      }
    }

    // Called from Go to populate fields
    function setDownloadInfo(url, name, folder, size) {
      document.getElementById('url').value = url;
      document.getElementById('url').title = url;
      document.getElementById('name').value = name;
      document.getElementById('folder').value = folder;
      if (size && size > 0) {
        document.getElementById('fileInfo').style.display = 'flex';
        document.getElementById('fileSize').textContent = '📦 ' + formatSize(size);
      }
      loadCategoriesAndQueues();
    }

    function formatSize(bytes) {
      if (bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    // Keyboard shortcuts
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') doCancel();
      if (e.key === 'Enter' && !e.shiftKey) doDownload();
    });
  </script>
</body>
</html>
