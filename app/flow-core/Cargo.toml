[package]
name = "flow-core"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", features = ["stream"] }
tokio = { version = "1.37", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
futures-util = "0.3"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.21"
